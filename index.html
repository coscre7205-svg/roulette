<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복불복 룰렛 - 1. 참가자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">

  <header class="hero">
    <span class="mascot" aria-hidden="true">🎡</span>
    <h1>오늘의 <em>복불복</em> 룰렛</h1>
    <p>이름을 넣고 돌려요. 운명의 한 명은 누구일까요?</p>
  </header>

  <nav class="tabs" aria-label="페이지 이동">
    <a class="tab active" href="index.html" data-go="players" aria-current="page"><span class="num">1</span><span>참가자</span><small><b id="tabCount">0</b>명</small></a>
    <a class="tab" href="roulette.html" data-go="roulette"><span class="num">2</span><span>룰렛</span><small>돌리기</small></a>
    <a class="tab" href="history.html" data-go="history"><span class="num">3</span><span>기록</span><small><b id="tabHist">0</b>번</small></a>
  </nav>

  <div class="grid">
    <!-- 1페이지: 참가자 -->
    <section class="card" aria-labelledby="t1">
      <div class="card-head">
        <div class="chip blue" aria-hidden="true">👥</div>
        <h2 id="t1">참가자</h2>
        <p class="sub">이름을 입력하고 Enter 또는 추가 버튼!</p>
      </div>

      <form class="add-form" id="addForm" autocomplete="off">
        <input id="nameInput" type="text" maxlength="12" placeholder="이름을 입력하세요" aria-label="참가자 이름">
        <button class="btn btn-outline" type="submit">추가</button>
      </form>
      <p class="msg" id="msg" role="status"></p>

      <div class="list-top">
        <span>참가자 <b id="count">0</b>명</span>
        <button class="link-btn" id="clearBtn" type="button">모두 지우기</button>
      </div>
      <ul class="names" id="names" aria-label="참가자 목록"></ul>

      <div class="page-actions">
        <a class="btn btn-next" id="nextBtn" href="roulette.html">룰렛으로 가기 →</a>
        <p class="note" id="nextHint"></p>
      </div>
    </section>
  </div>
</main>

<script src="common.js"></script>
<script src="players.js"></script>
</body>
</html>
